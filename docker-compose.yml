services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    expose:
      - "80"

  # Máy chủ API gọi mô hình ngôn ngữ. Khoá API nằm ngoài repo, trong /opt/estatesmart/api.env (xem api/.env.example).
  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: ${API_ENV_FILE:-/opt/estatesmart/api.env}
        required: false
    expose:
      - "8787"
    volumes:
      - api_data:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-estatesmart.site}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  api_data: # cơ sở dữ liệu mặt bằng (SQLite); giữ nguyên qua các lần deploy
  caddy_data:
  caddy_config:
